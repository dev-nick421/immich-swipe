# Docker Compose

services:
  immich-swipe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Pass environment variables at build time
        - VITE_SERVER_URL=${VITE_SERVER_URL:-}
        - VITE_USER_1_NAME=${VITE_USER_1_NAME:-}
        - VITE_USER_1_API_KEY=${VITE_USER_1_API_KEY:-}
        - VITE_USER_2_NAME=${VITE_USER_2_NAME:-}
        - VITE_USER_2_API_KEY=${VITE_USER_2_API_KEY:-}
        - VITE_USER_3_NAME=${VITE_USER_3_NAME:-}
        - VITE_USER_3_API_KEY=${VITE_USER_3_API_KEY:-}
        - VITE_USER_4_NAME=${VITE_USER_4_NAME:-}
        - VITE_USER_4_API_KEY=${VITE_USER_4_API_KEY:-}
        - VITE_USER_5_NAME=${VITE_USER_5_NAME:-}
        - VITE_USER_5_API_KEY=${VITE_USER_5_API_KEY:-}
    container_name: immich-swipe
    restart: unless-stopped
    ports:
      - "2293:80"
    environment:
      # Optional. The built-in Immich API proxy (no CORS setup needed) forwards to VITE_SERVER_URL.
      # Set IMMICH_URL only if this container must reach Immich under another address than your
      # browser, e.g. http://immich-server:2283 on Immich's Docker network. Read at container
      # start, no rebuild needed.
      - IMMICH_URL=${IMMICH_URL:-}
    # To reach Immich by container name, join Immich's Docker network (see `docker network ls`):
    # networks:
    #   - immich

# networks:
#   immich:
#     name: immich_default
#     external: true
