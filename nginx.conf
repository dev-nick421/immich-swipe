server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime settings, served to the app as /config.js. The include below switches this on when
    # IMMICH_URL is set on the container.
    set $immich_swipe_proxy false;

    # Generated at container start by /docker-entrypoint.d/40-immich-swipe.sh (see docker/):
    # the built-in Immich API proxy at /api/ when IMMICH_URL is set
    include /etc/nginx/immich-swipe/*.conf;

    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        return 200 "window.__IMMICH_SWIPE__ = { proxy: $immich_swipe_proxy };\n";
    }

    # Web app manifest (not in nginx's default mime.types)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Vue Router - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache HTML
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
